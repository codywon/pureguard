name: Build & Release PureGuard

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag or Version to release (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Prepare Keystore & Signing Environment
        run: |
          echo "Using repository persistent global release keystore for seamless overwrite updates"
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/app/pureguard_release.jks" >> $GITHUB_ENV
          echo "STORE_PASSWORD=pureguard123" >> $GITHUB_ENV
          echo "KEY_PASSWORD=pureguard123" >> $GITHUB_ENV
          echo "KEY_ALIAS=pureguard" >> $GITHUB_ENV

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease --stacktrace

      - name: Prepare Release Artifacts
        id: prepare_artifacts
        run: |
          RAW_TAG="${{ github.event.inputs.tag_name }}"
          if [ -z "$RAW_TAG" ]; then
            RAW_TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag_name=${RAW_TAG}" >> $GITHUB_OUTPUT
          
          mkdir -p release_assets
          # Copy generated release APKs to release_assets with clean versioned names
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" "release_assets/PureGuard-${RAW_TAG}.apk"
            echo "Release APK created: release_assets/PureGuard-${RAW_TAG}.apk"
          else
            echo "ERROR: Release APK not found!"
            find app/build/outputs -type f || true
            exit 1
          fi

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_artifacts.outputs.tag_name }}
          name: PureGuard ${{ steps.prepare_artifacts.outputs.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
